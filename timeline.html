<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Almarai:wght@300;400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: oklch(0.16 0.03 250); }
  a { color: oklch(0.97 0.006 90); text-decoration: none; }
  a:hover { color: oklch(0.75 0.13 250); }

  [dir="rtl"] { font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; }
  [dir="rtl"] *, [dir="rtl"] { letter-spacing: normal !important; text-transform: none !important; }
  [dir="rtl"] div, [dir="rtl"] span, [dir="rtl"] p, [dir="rtl"] a, [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3 { font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif !important; }
  [dir="rtl"] h1 { font-weight: 300 !important; line-height: 1.42 !important; }
  [dir="rtl"] h2 { font-weight: 300 !important; line-height: 1.46 !important; }
  [dir="rtl"] h3 { font-weight: 500 !important; line-height: 1.55 !important; }
  [dir="rtl"] p { font-weight: 400; line-height: 1.95 !important; }
  [dir="rtl"] [style*="IBM Plex Mono"] { font-weight: 500 !important; }
  [dir="rtl"] [style*="Newsreader"]:not(h1):not(h2):not(h3) { font-weight: 500 !important; }
</style>
</helmet>
<div dir="{{ dir }}" style="min-height: 100vh; background: oklch(0.16 0.03 250); color: oklch(0.97 0.006 90); font-family: Archivo, 'IBM Plex Sans Arabic', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; padding: 16px clamp(16px, 4vw, 44px); border-bottom: 1px solid rgba(255,255,255,0.1);">
    <div style="display: flex; align-items: center; gap: 18px;">
      <a href="./index.html" style="font-family: 'IBM Plex Mono', 'IBM Plex Sans Arabic', monospace; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.7);">{{ t.back }}</a>
      <img src="./assets/tamo-haus-logo-white.png" alt="Tamo Haus" style="height: 24px; width: auto; display: block;" />
    </div>
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans Arabic', monospace; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.4);">{{ t.stamp }}</span>
    </div>
  </div>

  <div style="max-width: 1180px; margin: 0 auto; padding: clamp(40px, 6vw, 76px) clamp(20px, 5vw, 64px) 88px; box-sizing: border-box;">

    <div style="margin-bottom: clamp(38px, 5vw, 64px);">
      <div style="font-family: 'IBM Plex Mono', 'IBM Plex Sans Arabic', monospace; font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.75 0.13 250); margin-bottom: 22px;">{{ t.eyebrow }}</div>
      <h1 style="font-family: Newsreader, 'Almarai', serif; font-weight: 300; font-size: clamp(34px, 4.6vw, 60px); line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 22px; max-width: 26ch;">{{ t.h1a }} <span style="{{ accentStyle }}">{{ t.h1b }}</span></h1>
      <p style="font-size: 15px; line-height: 1.8; color: rgba(255,255,255,0.6); margin: 0; max-width: 62ch; text-wrap: pretty;">{{ t.lede }}</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.12); margin-bottom: clamp(38px, 5vw, 60px);">
      <sc-for list="{{ t.lanes }}" as="l" hint-placeholder-count="3">
        <div style="background: oklch(0.2 0.03 250); display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding: clamp(24px, 3vw, 34px) clamp(22px, 3vw, 34px);">
          <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 14px 28px;">
            <div style="display: flex; align-items: baseline; gap: 16px;">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.2em; color: oklch(0.75 0.13 250);">{{ l.n }}</span>
              <h2 style="font-family: Newsreader, 'Almarai', serif; font-weight: 300; font-size: clamp(23px, 2.7vw, 32px); line-height: 1.2; margin: 0;">{{ l.title }}</h2>
            </div>
            <div style="display: flex; align-items: baseline; gap: 10px;">
              <span style="font-family: Newsreader, 'Almarai', serif; font-size: clamp(26px, 3vw, 36px); line-height: 1; color: oklch(0.75 0.13 250);">{{ l.days }}</span>
              <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans Arabic', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.45);">{{ l.unit }}</span>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 40px; align-items: start;">
            <p style="font-size: 14px; line-height: 1.8; color: rgba(255,255,255,0.6); margin: 0;">{{ l.note }}</p>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              <sc-for list="{{ l.items }}" as="it" hint-placeholder-count="3">
                <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans Arabic', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.22); padding: 8px 12px; color: rgba(255,255,255,0.7);">{{ it }}</span>
              </sc-for>
            </div>
          </div>
          <div style="height: 8px; background: rgba(255,255,255,0.08); position: relative;">
            <div style="position: absolute; top: 0; bottom: 0; inset-inline-start: {{ l.left }}; width: {{ l.width }}; background: oklch(0.55 0.16 252);"></div>
          </div>
        </div>
      </sc-for>
      <div style="background: oklch(0.2 0.03 250); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 28px; padding: 18px clamp(22px, 3vw, 34px);">
        <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans Arabic', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.4);">{{ t.startEnd }}</span>
        <span style="font-family: 'IBM Plex Mono', 'IBM Plex Sans Arabic', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: oklch(0.75 0.13 250);">{{ t.gate }}</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: clamp(28px, 4vw, 64px);">
      <div>
        <div style="font-family: 'IBM Plex Mono', 'IBM Plex Sans Arabic', monospace; font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 20px;">{{ t.assumes }}</div>
        <div style="border-top: 1px solid rgba(255,255,255,0.14);">
          <sc-for list="{{ t.deps }}" as="d" hint-placeholder-count="4">
            <div style="padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.14); display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start;">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: oklch(0.75 0.13 250); padding-top: 4px;">{{ d.n }}</span>
              <div style="font-size: 13.5px; line-height: 1.75; color: rgba(255,255,255,0.7);">{{ d.text }}</div>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="border: 1px solid rgba(255,255,255,0.14); padding: clamp(24px, 3vw, 34px); align-self: start;">
        <div style="font-family: 'IBM Plex Mono', 'IBM Plex Sans Arabic', monospace; font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 20px;">{{ t.orderTitle }}</div>
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <sc-for list="{{ t.order }}" as="o" hint-placeholder-count="3">
            <div style="display: flex; align-items: baseline; gap: 14px;">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: oklch(0.75 0.13 250);">{{ o.n }}</span>
              <span style="font-family: Newsreader, 'Almarai', serif; font-size: 20px; line-height: 1.4;">{{ o.text }}</span>
            </div>
          </sc-for>
        </div>
        <p style="font-size: 13px; line-height: 1.8; color: rgba(255,255,255,0.45); margin: 24px 0 0;">{{ t.orderNote }}</p>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1000}}">
class Component extends DCLogic {
  renderVals() {
    const ar = true;
    const en = {
      back: '← All views',
      stamp: 'Timeline · Special Touch Co.',
      langBtn: 'العربية',
      eyebrow: 'Delivery timeline',
      h1a: 'Three deliverables, in', h1b: 'working days.',
      lede: 'Sequential by design: the identity is approved first, then applied to the profile and the website — so nothing is designed twice.',
      workingDays: 'working days',
      startEnd: 'Start → handover',
      gate: 'Approval point at the end of every stage',
      assumes: 'What the timeline assumes',
      orderTitle: 'Order of work',
      orderNote: 'Brand first, then everything the brand touches. Profile and website design can run in parallel once the identity is signed off.',
      lanes: [
        { n: '01', title: 'Brand identity redesign', days: '5', unit: 'working days', note: 'Discovery, logo system, colour and typography (Arabic and English), applications and the brand guidelines document.', items: ['Logo versions', 'Colour & type system', 'Stationery', 'Guidelines'], left: '0%', width: '17%' },
        { n: '02', title: 'Company profile design', days: '2', unit: 'working days', note: 'Full layout in the approved identity, in two complete language versions. Content is supplied by Special Touch.', items: ['English version', 'Arabic RTL version', 'Print + digital files'], left: '17%', width: '7%' },
        { n: '03', title: 'Portfolio website — design to launch', days: '20–25', unit: 'working days', note: 'UI/UX design, full responsive development, project portfolio system, enquiry and quote forms, testing and launch.', items: ['UI/UX design', 'Development', 'Bilingual structure', 'Testing & launch'], left: '24%', width: '76%' },
      ],
      deps: [
        { n: '01', text: 'Working days, excluding weekends and public holidays.' },
        { n: '02', text: 'The clock starts when approved content is supplied — project photography, technical detail and company information.' },
        { n: '03', text: 'All written text, English and Arabic, is provided by Special Touch. Scope covers design, layout and art direction.' },
        { n: '04', text: 'Each stage ends with a review; revision rounds inside a stage do not extend the following one.' },
      ],
      order: [
        { n: '01', text: 'Identity developed and approved' },
        { n: '02', text: 'Company profile laid out in the new system' },
        { n: '03', text: 'Website designed, built and launched' },
      ],
    };
    const arT = {
      back: 'كل العروض ←',
      stamp: 'الجدول الزمني · Special Touch',
      langBtn: 'English',
      eyebrow: 'الجدول الزمني للتنفيذ',
      h1a: 'ثلاثة أعمال تُنفَّذ بالتتابع،', h1b: 'ومدّتها محسوبة بأيام العمل.',
      lede: 'الترتيب مقصود: تُعتمد الهوية البصرية أولاً، ثم تُطبَّق على كتاب الشركة وعلى الموقع — كي لا يُعاد تصميم العمل نفسه مرتين.',
      workingDays: 'أيام عمل',
      startEnd: 'من بداية العمل حتى التسليم',
      gate: 'تنتهي كل مرحلة باعتماد من الشركة',
      assumes: 'ما يقوم عليه هذا الجدول',
      orderTitle: 'ترتيب تنفيذ الأعمال',
      orderNote: 'الهوية أولاً، ثم كل ما تُطبَّق عليه. ويمكن تنفيذ كتاب الشركة والموقع بالتوازي بعد اعتماد الهوية.',
      lanes: [
        { n: '01', title: 'إعادة تصميم الهوية البصرية', days: '٥', unit: 'أيام عمل', note: 'دراسة العلامة، وبناء نظام الشعار، واختيار الألوان والخطوط بالعربي والإنجليزي، وتطبيقاتها، وإعداد دليل الهوية.', items: ['الشعار بصيغه المختلفة', 'نظام الألوان والخطوط', 'المطبوعات الرسمية', 'دليل استخدام الهوية'], left: '0%', width: '17%' },
        { n: '02', title: 'تصميم كتاب الشركة', days: '٢', unit: 'يوما عمل', note: 'تصميم الكتاب كاملاً بالهوية المعتمدة، بنسختين لغويتين مستقلّتين. تتولّى الشركة تزويدنا بالنصوص.', items: ['نسخة إنجليزية', 'نسخة عربية من اليمين إلى اليسار', 'ملفات للطباعة وللعرض الرقمي'], left: '17%', width: '7%' },
        { n: '03', title: 'موقع البورتفوليو — من التصميم حتى الإطلاق', days: '٢٠–٢٥', unit: 'يوم عمل', note: 'تصميم الواجهات وتجربة المستخدم، وتطوير الموقع ليعمل على جميع الأجهزة، وبناء نظام عرض المشاريع، ونماذج الاستفسار وطلب السعر، ثم الاختبار والإطلاق.', items: ['تصميم الواجهات', 'التطوير والبرمجة', 'بنية بلغتين', 'الاختبار والإطلاق'], left: '24%', width: '76%' },
      ],
      deps: [
        { n: '01', text: 'المدّة محسوبة بأيام العمل، ولا تشمل أيام الجمعة والسبت ولا العطل الرسمية.' },
        { n: '02', text: 'يبدأ حساب المدّة من يوم استلامنا المحتوى المعتمد: صور المشاريع، والبيانات الفنية، ومعلومات الشركة.' },
        { n: '03', text: 'تتولّى الشركة كتابة النصوص بالعربي والإنجليزي، ويشمل نطاق عملنا التصميم والإخراج والإدارة الفنية.' },
        { n: '04', text: 'تنتهي كل مرحلة بمراجعة واعتماد، ولا تؤثّر جولات التعديل داخل المرحلة على موعد المرحلة التي تليها.' },
      ],
      order: [
        { n: '01', text: 'تطوير الهوية البصرية واعتمادها' },
        { n: '02', text: 'إخراج كتاب الشركة بالهوية الجديدة' },
        { n: '03', text: 'تصميم الموقع وتنفيذه وإطلاقه' },
      ],
    };
    return {
      t: ar ? arT : en,
      dir: ar ? 'rtl' : 'ltr',
      accentStyle: ar ? 'display: block; color: oklch(0.75 0.13 250);' : 'font-style: italic; color: oklch(0.75 0.13 250);',
    };
  }
}
</script>
</body>
</html>
